# Отдельный server-блок nginx для music.<домен>.
# ВАЖНО: существующий конфиг основного сайта не трогаем — этот файл новый.
# Установка:
#   sudo cp deploy/nginx-music.conf /etc/nginx/sites-available/music.conf
#   sudo ln -s /etc/nginx/sites-available/music.conf /etc/nginx/sites-enabled/music.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name music.EXAMPLE.COM;

    # Голосовая запись: до 10 МБ аудио + запас под multipart-обвязку.
    client_max_body_size 12m;

    # Статика и API — на один и тот же прокси.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE-стриминг генерации: буферизация ломает живую печать кода.
    location /api/generate {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        add_header X-Accel-Buffering no;
    }

    # Транскрипция голоса: запрос дольше обычного, нужен свой таймаут.
    location /api/transcribe {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_request_buffering off;
    }

    # Кэш статики не нужен: сборка меняется при каждом деплое.
    location /assets/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 1h;
    }
}
