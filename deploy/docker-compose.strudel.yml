# Сервис студии в общем compose-проекте сервера (рядом с Caddy).
#
# Отдельный файл, чтобы не трогать основной docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.strudel.yml up -d strudel
#
# Сервис попадает в ту же docker-сеть, где работает Caddy, поэтому прокси
# обращается к нему по имени (strudel:3001) — порт наружу не публикуется.
services:
  strudel:
    build:
      context: /opt/strudel
      dockerfile: Dockerfile
    image: strudel-ai-composer:local
    env_file:
      - /opt/strudel/.env
    environment:
      NODE_ENV: production
      PORT: "3001"
      # Слушаем все адреса контейнера: до 127.0.0.1 обратный прокси из
      # соседнего контейнера не достучится.
      HOST: "0.0.0.0"
      # Режим «Разбор»: воркер анализа живёт в соседнем контейнере,
      # рабочие файлы — в общем томе (пути должны совпадать у обоих).
      DD_WORKER_URL: "http://deepdive-worker:8010"
      DD_WORKSPACE_DIR: "/data/deepdive"
      # Мьютексы — общий каталог с хостом. Деплой берёт ТОТ ЖЕ лок перед
      # сборкой образа, поэтому разбор и сборка не могут идти одновременно
      # (на 2 ядрах и 3.8 ГБ RAM это OOM).
      DD_LOCK_DIR: "/lock"
    expose:
      - "3001"
    volumes:
      - deepdive-data:/data
      - /opt/dd-lock:/lock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Воркер анализа режима «Разбор»: темп, лад, секции, питч баса, аккорды,
  # разделение на стемы (Demucs). Python-окружение — общий venv с хоста.
  deepdive-worker:
    build:
      context: /opt/strudel/deploy
      dockerfile: Dockerfile.deepdive-worker
    image: strudel-deepdive-worker:local
    volumes:
      - /opt/dd-venv:/opt/dd-venv:ro
      - /root/.cache/torch:/root/.cache/torch:ro
      - /opt/strudel/server/deepdive/analysis:/analysis:ro
      - deepdive-data:/data
      - /opt/dd-lock:/lock
    environment:
      DD_PORT: "8010"
      DD_PYTHON: "/opt/dd-venv/bin/python"
      HOME: "/root"
      # Мьютекс тяжёлых операций (flock). Тот же файл берёт деплой на хосте:
      # пока Demucs работает, образ не собирается.
      DD_HEAVY_LOCK: "/lock/heavy.lock"
      DD_HEAVY_LOCK_WAIT_S: "3600"
    expose:
      - "8010"
    restart: unless-stopped

volumes:
  deepdive-data:
