
music.34.88.114.146.sslip.io {
	# SSE-поток режима «Разбор»: без буферизации и без сжатия.
	#
	# ПОЧЕМУ ОТДЕЛЬНЫЙ ОБРАБОТЧИК. Разбор на CPU идёт десятки минут (замер:
	# 240 с аудио → 1356 с разделения). Буферизация прокси задерживает
	# события потока, а сжатие добавляет к этому ещё и задержку первого
	# байта. flush_interval -1 — «сразу, как пришло».
	@deepdive path /api/deepdive/*
	handle @deepdive {
		reverse_proxy strudel:3001 {
			flush_interval -1
		}
	}

	handle {
		encode zstd gzip
		reverse_proxy strudel:3001
	}

	header {
		X-Content-Type-Options nosniff
		Referrer-Policy strict-origin-when-cross-origin
	}
}
