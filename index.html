<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strudel AI Composer</title>
  </head>
  <body>
    <div id="app">
      <header class="header">
        <h1>Strudel AI Composer</h1>
        <p class="subtitle">Опишите музыку словами — AI напишет код на Strudel и сразу исполнит его</p>
      </header>

      <main class="layout">
        <section class="panel composer" aria-label="Управление">
          <label class="field-label" for="prompt-input">Команда</label>
          <textarea id="prompt-input" rows="3" placeholder="Например: драм-партия в стиле Queen с мощным басом"></textarea>

          <div class="controls">
            <button id="btn-voice" class="btn" type="button">🎤 Голос</button>
            <button id="btn-run" class="btn primary" type="button">▶ Исполнить</button>
            <button id="btn-stop" class="btn" type="button">⏹ Стоп</button>
            <button id="btn-clear" class="btn" type="button">🗑 Сброс</button>
          </div>

          <div id="voice-status" class="voice-status" hidden></div>

          <label class="field-label" for="code-input">Код Strudel (можно править вручную)</label>
          <textarea id="code-input" class="code" rows="12" spellcheck="false" placeholder="// Здесь появится сгенерированный код"></textarea>

          <div class="controls">
            <button id="btn-play-code" class="btn" type="button">▶ Играть этот код</button>
          </div>
        </section>

        <section class="panel output" aria-label="Результат">
          <h2>Визуализация</h2>
          <div id="strudel-container"></div>

          <h2>Лог</h2>
          <div id="log" class="log" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <div id="audio-gate" class="audio-gate">
      <div class="gate-card">
        <h2>Включить звук</h2>
        <p>Браузеры разрешают воспроизведение звука только после клика пользователя.</p>
        <button id="btn-start-audio" class="btn primary" type="button">Start Audio</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
