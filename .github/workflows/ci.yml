name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Синтаксис
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  checks:
    name: Проверки знаний и секретов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run check:presets
      - run: npm run check:knowledge
      - run: npm run check:skills
      - run: npm run check:baseline

  build:
    name: Сборка и бюджет бандла
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run bundle:budget
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  docker:
    name: Образ Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Dockerfile и .dockerignore не проверяются на машине разработчика без
      # запущенного демона — поэтому образ собирается здесь и не пушится.
      - name: Сборка образа
        run: docker build -t strudel-ai-composer:ci .
      - name: Образ поднимается и отвечает
        run: |
          docker run -d --name ci-app -p 3001:3001 -e MOCK_LLM=1 strudel-ai-composer:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null 2>&1; then
              echo "health ok"; exit 0
            fi
            sleep 1
          done
          echo "контейнер не ответил"; docker logs ci-app; exit 1
      - name: Остановка
        if: always()
        run: docker rm -f ci-app || true

  smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Google Chrome на ubuntu-latest предустановлен; playwright-core
      # браузеры не скачивает — используем системный.
      - name: Playwright smoke
        run: node tests/smoke/smoke.mjs
        env:
          MOCK_LLM: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-log
          path: tests/smoke/
          retention-days: 7
