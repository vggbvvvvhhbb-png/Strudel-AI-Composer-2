# Запуск одной командой: docker compose up --build
#
# Ключи приходят из .env (docker compose читает его автоматически).
# В образе ключей нет — только в окружении контейнера.

services:
  app:
    build: .
    image: strudel-ai-composer:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      # Внутри контейнера слушаем все адреса: до 127.0.0.1 обратный прокси
      # в соседнем контейнере не достучится. Порт наружу не публикуется.
      HOST: ${HOST:-0.0.0.0}
      LLM_PROVIDERS: ${LLM_PROVIDERS:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
